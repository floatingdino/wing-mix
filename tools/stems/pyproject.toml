[project]
name = "wingmix-stems"
version = "0.1.0"
description = "Wing Mix stem-separation sidecar (JSON lines over stdin/stdout); optional, installed on demand by tools/stems/install.sh"
requires-python = ">=3.10,<3.13"
dependencies = [
    "demucs==4.1.0",
    "torch>=2.2,<3",
    "torchaudio>=2.2,<3",
    "numpy<2",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Licence-clean alternative (weights MIT): `uv sync --extra umx`
umx = ["openunmix==1.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wingmix_stems"]
