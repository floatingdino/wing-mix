# ===================== stereo pairs (M039) =======================================================================
# A detected/confirmed stereo pair may spread to full L/R on its own side (input-pair-spread, +-100); mono sources
# and moves across the centre keep input-level-pan's +-50. Coupling, locks and revive apply as before.

[[case]]
id = "pair-left-spreads-to-full-left"
param = "input.11/pan"
