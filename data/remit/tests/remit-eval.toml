# Remit evaluator test cases (M004 -> M010 unit tests). Spec: docs/research/remit.md sections 3-5.
# Policy under test: data/remit/wing-default.toml (plus a per-case `overlay` of extra rules where given).
#
# The topology is generic (no WING paths) and modelled on wing-simulator fixtures/PUBLIC.snap after role
# detection: roles below are the *effective* roles (section 6.5). Strip fields:
#   id, kind, role, name (optional; stereo pairs are detected from names, M039), tags, chain (block order; position decides coupling), sends (dest, tap_after = last block
#   before the send's tap, active), feeds_protected (strip output is re-input into a monitor/comms mix after all
#   of its processing), hosts (fx pseudo-strips: "strip/insert.N" where the slot is inserted; empty = free slot).
#
# Case fields: param (generic ParamId), class (param class reported by the surface), optional from/to (current
# and requested value, for value-dependent checks: revive, insert slot, fx model), optional confirmed (rule ids the
# user confirmed this session), optional overlay (extra rules appended to the policy), optional action = "solo" with
# solo_destructive. Expected: class (allowed|conditional|forbidden), reason (first decisive step:
# unknown|readonly|hard|locked|unconfirmed|deny_tag|default_deny|rule|coupling|revive|inspection), rule (id of the
# deciding rule, when reason is rule/coupling/revive or an unlock happened), coupled (optional bool), max_delta_pct
# (optional: the decision's pan/percent envelope).

format = "wing-mix-remit-tests/1"

[surface]
solo_destructive = false
external_fx_models = ["EXT"]     # models the surface reports as external hardware loops (capability flag)
# A send/insert/fader at or below -90 dB is "silent" (revive.floor_db).

[[strip]]
id = "input.1"            # KICK: pre-fader IEM sends tap after dyn (WING ptap 5 with GEDI), GRP send to drums
kind = "input"
role = "foh"
chain = ["preamp", "in", "filter", "insert.1", "gate", "eq", "dyn", "insert.2", "fader", "pan"]
sends = [ { dest = "bus.8", tap_after = "dyn", active = true }, { dest = "bus.6", tap_after = "pan", active = true } ]

[[strip]]
