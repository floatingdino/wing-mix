# Role-detection test cases (M004 -> M010 unit tests). Spec: docs/research/remit.md section 6.
#
# Each case gives the GENERIC evidence the adapter extracts for one strip (`input`) and the expected outcome.
# Expectations are deliberately coarse so the weights can be tuned without rewriting the table:
#   role        winning role of the scorer (bus: monitor|comms|fx|foh_group|aux_feed|unknown;
#               input: foh|monitor|comms|unrouted; main: main|aux_feed)
#   confidence  band of the winner's probability: high (>= 0.85), medium (0.60..0.85), low (< 0.60); omitted = any
#   effective   role the remit uses before the user confirms anything (section 6.5)
#   usable      effective role is writable under the default policy (foh/foh_group/fx/main)
#   name_hit    a monitor/comms vocabulary token was found in the name (bus cases; omitted = not checked)
#
# Bus evidence fields:
#   name, active_senders (sends on and > -90 dB, or on in subgroup mode), pre_fraction, group_fraction (of active
#   sends), feeds_main (direct|indirect|none), outputs (subset of physical|computer|recorder: kinds of outputs the
#   bus is patched to), talkback_dest, fx_insert (none|time|other; time = reverb/delay/modulation model),
#   feeds_matrix, re_input_to_monitor (bus output is re-input on a strip that feeds a monitor/comms bus).
# Input evidence: name, talkback_source, reaches_main (direct|indirect|none), reaches_monitor.
# Main evidence: name.

format = "wing-mix-remit-tests/1"

# ===================== fixtures/PUBLIC.snap (wing-simulator; real WING scene, fw 1.13.9) ========================
# Evidence extracted by the WING adapter rules in remit.md appendix A.4. Bus n's output legs are BUS 2n-1/2n.

