  { feature = "band_dev_db.sub", delta = [-1.5, 0.0] },
  { feature = "lra_lu", delta = [-2.0, -1.0] },
  { feature = "reverb_rel_dev_db", delta = [-3.0, -1.0] },
]
blocks_hint = ["Eq", "Dyn", "Gate", "Send"]
conflicts = ["boomy", "heavy", "wet"]
confidence = "medium"
sources = ["senior2011", "owsinski2017"]

[[term]]
id = "dynamic"
synonyms = ["breathing", "open dynamics", "uncompressed", "natural dynamics", "live-sounding"]
antonym = "compressed"
kind = "dynamics"
polarity = "desirable"
default_scope = "mix"
scopable = true
deltas = [
  { feature = "crest_db", delta = [2.0, 4.0] },
  { feature = "plr_db", delta = [2.0, 4.0] },
  { feature = "lra_lu", delta = [1.0, 3.0] },
]
blocks_hint = ["Dyn"]
conflicts = ["compressed", "loud"]
confidence = "high"
sources = ["katz2015", "ebu_r128"]

[[term]]
