# ======================================= DYNAMICS ==============================================================
[[term]]
id = "punchy"
synonyms = ["punch", "impact", "hard-hitting", "slam", "thump", "snappy"]
antonym = "soft"
kind = "dynamics"
polarity = "desirable"
default_scope = "drums"
scopable = true
deltas = [
  { feature = "transient_db", delta = [2.0, 4.0] },
  { feature = "crest_db", delta = [1.0, 3.0] },
  { feature = "band_dev_db.bass", delta = [0.5, 1.5] },
  { feature = "band_dev_db.low_mid", delta = [-1.5, -0.5] },
  { feature = "level_dev_lu", delta = [0.5, 1.5] },
]
blocks_hint = ["Dyn", "Eq", "Fader"]
conflicts = ["compressed", "soft", "wet"]
confidence = "medium"
sources = ["senior2011", "izhaki2018", "giannoulis2012"]
note = "punch comes from transients surviving: slower compressor attack, less low-mid clutter, kick/bass separation"

[[term]]
id = "tight"
synonyms = ["controlled", "focused", "tight low end"]
antonym = "boomy"
kind = "dynamics"
polarity = "desirable"
