# Wing Mix knowledge base: per-source-type defaults and typical problem frequencies.
# Rationale and citations: docs/research/mix-knowledge.md (section "sources.toml").
# Feature names, bands, blocks, condition/action grammar: data/knowledge/workflow.toml [schema], [features], [blocks].

[schema]
version = 1
file = "sources"
description = "One [[source]] per source type: name-matching hints, useful range, filter defaults, characteristic bands, typical problems (as conditional EQ actions), and references to dynamics/fx presets, pan and balance hints."

[schema.source_fields]
id               = "string, unique source type id (used by M025 channel identification and other files' applies_to)"
family           = "string: drums | bass | guitar | keys | vocal | playback | ambience | speech | brass_strings"
name_hints       = "list of case-insensitive substrings/regex fragments matched against strip names/tags (M025 combines with audio features)"
fundamental_hz   = "[lo, hi] Hz where the source's fundamentals/body energy normally lie"
useful_range_hz  = "[lo, hi] Hz outside of which content is mostly noise/bleed for this source"
hpf              = "Filter action: { freq_hz = [lo, hi], slope_db_per_oct = n, start_hz = n } - start_hz is the conservative first move"
lpf              = "optional Filter action, same shape"
character        = "list of { name, freq_hz = [lo, hi], effect } - what boosting the region does; used by vocabulary/tonal EQ"
problems         = "list of { id, freq_hz = [lo, hi], when = [conditions], action = Eq action, confidence, note }; actions are cuts unless stated"
gate_preset      = "id in dynamics.toml [[gate_preset]] or \"none\""
dyn_preset       = "id in dynamics.toml [[comp_preset]] or \"none\""
deess_preset     = "optional id in dynamics.toml [[deess_preset]]"
fx_preset        = "id in fx.toml [[send_preset]] or \"none\""
pan_pct          = "[lo, hi] typical pan position range (-100 L .. +100 R); for stereo pairs the spread of the pair"
level_rel_mix_lu = "[lo, hi] typical level_rel_mix_lu when no reference/stem target exists (genre-dependent, low confidence; TargetProfile overrides)"
polarity_note    = "optional string: polarity/time-alignment checks"
confidence       = "high | medium | low - consensus strength across sources"
sources          = "keys into workflow.toml [sources]"

# Problems carry their own condition lists. Common shapes:
#   band excess: { feature = "band_dev_db.<band>", op = ">", value = X }  (strip vs its own target or mix target)
#   narrow resonance: { feature = "resonance_db", op = ">", value = 6 } plus { feature = "resonance_hz", op = "between", value = [lo, hi] }

# ======================================= DRUMS =================================================================
[[source]]
id = "kick"
family = "drums"
name_hints = ["kick", "kik", "bd", "bass ?drum", "kick ?in", "kick ?out", "kick ?sub"]
fundamental_hz = [45, 100]
useful_range_hz = [30, 10000]
hpf = { freq_hz = [25, 45], slope_db_per_oct = 24, start_hz = 30 }
lpf = { freq_hz = [7000, 12000], slope_db_per_oct = 12, start_hz = 10000, note = "optional, reduces cymbal bleed into kick" }
character = [
  { name = "sub_weight", freq_hz = [40, 70], effect = "felt low end; boosting adds weight but eats headroom" },
  { name = "punch", freq_hz = [70, 120], effect = "chest thump" },
  { name = "beater_click", freq_hz = [2000, 5000], effect = "attack/definition through a dense mix" },
]
problems = [
  { id = "kick_box", freq_hz = [250, 500], when = [ { feature = "band_rel_db.low_mid", op = ">", value = -10.0 } ], action = { block = "Eq", type = "peq", freq_hz = [250, 450], gain_db = [-8.0, -3.0], q = [1.0, 2.5] }, confidence = "high", note = "cardboard/boxy tone, classic scoop region" },
  { id = "kick_mud_vs_bass", freq_hz = [100, 250], when = [ { feature = "masking_db.low_mid_lo", op = ">", value = 3.0 } ], action = { block = "Eq", type = "peq", freq_hz = [120, 220], gain_db = [-4.0, -2.0], q = [1.0, 2.0] }, confidence = "medium", note = "make room for bass body; see eq.toml masking rules" },
  { id = "kick_no_click", freq_hz = [2000, 5000], when = [ { feature = "transient_db", op = "<", value = 6.0 } ], action = { block = "Eq", type = "peq", freq_hz = [2500, 4500], gain_db = [2.0, 5.0], q = [1.0, 2.0] }, confidence = "medium", note = "boost: attack missing in mix" },
]
gate_preset = "kick_gate"
dyn_preset = "kick_comp"
fx_preset = "drums_short_room"
pan_pct = [0, 0]
level_rel_mix_lu = [-8.0, -3.0]
confidence = "high"
sources = ["senior2011", "owsinski2017", "izhaki2018", "shure_mics"]

[[source]]
id = "snare_top"
family = "drums"
name_hints = ["snare", "sn ?top", "snr", "sd", "snare ?t"]
fundamental_hz = [150, 250]
useful_range_hz = [80, 16000]
hpf = { freq_hz = [70, 120], slope_db_per_oct = 18, start_hz = 90 }
character = [
  { name = "body", freq_hz = [150, 250], effect = "fatness/weight of the hit" },
  { name = "crack", freq_hz = [2000, 5000], effect = "attack/crack" },
  { name = "snap", freq_hz = [5000, 10000], effect = "wire sizzle, air" },
]
problems = [
  { id = "snare_ring", freq_hz = [300, 1200], when = [ { feature = "resonance_db", op = ">", value = 6.0 }, { feature = "resonance_hz", op = "between", value = [300, 1200] } ], action = { block = "Eq", type = "peq", freq_hz = "resonance_hz", gain_db = [-8.0, -3.0], q = [4.0, 8.0] }, confidence = "high", note = "drum-head overtone ring; narrow cut at the measured peak" },
  { id = "snare_box", freq_hz = [400, 800], when = [ { feature = "band_rel_db.mid", op = ">", value = -6.0 } ], action = { block = "Eq", type = "peq", freq_hz = [400, 800], gain_db = [-5.0, -2.0], q = [1.0, 2.0] }, confidence = "medium" },
  { id = "snare_hihat_bleed", freq_hz = [6000, 12000], when = [ { feature = "noise_floor_dbfs", op = ">", value = -50.0 } ], action = { block = "Gate", mode = "expander", expander_ratio = [2.0, 3.0], range_db = [6.0, 12.0] }, confidence = "medium", note = "prefer expansion over EQ: cutting hats also cuts snap" },
]
gate_preset = "snare_expander"
dyn_preset = "snare_comp"
fx_preset = "snare_plate"
pan_pct = [-10, 10]
level_rel_mix_lu = [-8.0, -3.0]
confidence = "high"
sources = ["senior2011", "owsinski2017", "izhaki2018"]

